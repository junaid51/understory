name: ci

on:
  push: { branches: [main] }
  pull_request:

# The bench and deep tiers arrive at commit 11. This is the fast tier only:
# it must stay under three minutes or pull requests stop being reviewed promptly.
jobs:
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm' }
      - run: npm ci
      - run: npm run verify
